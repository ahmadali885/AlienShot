name: Build macOS app

# AlienShot is developed on Windows, which cannot cross-compile for macOS.
# This builds the .app on a GitHub-hosted Mac and uploads it as an artifact,
# so a Mac is only needed to *run* the result, not to build it.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # pubspec.lock resolves against Dart >= 3.12 / Flutter >= 3.44,
          # which is only on beta at the time of writing.
          channel: beta
          cache: true

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Zip the .app
        # ditto, not zip: it preserves the bundle's symlinks and metadata, so
        # the app still launches after being unpacked on another Mac.
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent AlienShot.app AlienShot-macos.zip

      - name: Build the installer package
        # The macOS counterpart of the Windows setup .exe: an Installer.app
        # wizard (installer/macos/pkg) that installs into /Applications.
        run: |
          APP=build/macos/Build/Products/Release/AlienShot.app
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          PKG=installer/macos/pkg
          mkdir -p pkg-root pkg-build pkg-resources
          ditto "$APP" pkg-root/AlienShot.app

          # Scripts come from a Windows checkout: make sure they run.
          for s in "$PKG"/scripts/*; do sed -i '' 's/\r$//' "$s"; chmod +x "$s"; done

          # Otherwise Installer "relocates" the upgrade into any other copy of
          # AlienShot.app it finds (say, one left in Downloads) instead of
          # /Applications.
          # The analysis lists every bundle inside the app (plugin frameworks
          # too), in no fixed order, so clear the flag on all of them.
          pkgbuild --analyze --root pkg-root component.plist
          i=0
          while /usr/libexec/PlistBuddy -c "Print :$i" component.plist > /dev/null 2>&1; do
            /usr/libexec/PlistBuddy -c "Set :$i:BundleIsRelocatable false" component.plist 2> /dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$i:BundleIsRelocatable bool false" component.plist
            echo "non-relocatable: $(/usr/libexec/PlistBuddy -c "Print :$i:RootRelativeBundlePath" component.plist)"
            i=$((i + 1))
          done

          pkgbuild --root pkg-root \
            --component-plist component.plist \
            --install-location /Applications \
            --identifier com.alienwavegroup.alienshot \
            --version "$VERSION" \
            --scripts "$PKG/scripts" \
            pkg-build/AlienShot-component.pkg

          cp "$PKG"/resources/*.html pkg-resources/
          tiffutil -cathidpicheck "$PKG/art/background.png" "$PKG/art/background@2x.png" \
            -out pkg-resources/background.tiff
          tiffutil -cathidpicheck "$PKG/art/background-dark.png" "$PKG/art/background-dark@2x.png" \
            -out pkg-resources/background-dark.tiff
          sed "s/@VERSION@/$VERSION/" "$PKG/distribution.xml" > distribution.xml

          productbuild --distribution distribution.xml \
            --resources pkg-resources \
            --package-path pkg-build \
            AlienShot-Installer.pkg
          # Sanity check: the app binary really is in the payload.
          pkgutil --payload-files pkg-build/AlienShot-component.pkg > payload.txt
          grep -q 'AlienShot.app/Contents/MacOS/AlienShot$' payload.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AlienShot-Installer
          path: AlienShot-Installer.pkg
          if-no-files-found: error

      - name: Build the DMG
        # The usual drag-to-Applications window. Finder lays it out over
        # AppleScript, which can time out on a CI Mac, so retry a few times and
        # fall back to a plain (unstyled) DMG rather than fail the build.
        run: |
          brew install create-dmg
          APP=build/macos/Build/Products/Release/AlienShot.app
          mkdir dmg-src
          ditto "$APP" dmg-src/AlienShot.app
          # One TIFF holding both resolutions, so Retina screens get the @2x.
          tiffutil -cathidpicheck installer/macos/dmg-background.png \
            installer/macos/dmg-background@2x.png -out dmg-background.tiff
          VOLICON=()
          ICNS="$APP/Contents/Resources/AppIcon.icns"
          [ -f "$ICNS" ] && VOLICON=(--volicon "$ICNS")
          for attempt in 1 2 3; do
            rm -f AlienShot.dmg rw.*.dmg
            if create-dmg \
                --volname "AlienShot" \
                "${VOLICON[@]}" \
                --background dmg-background.tiff \
                --window-pos 200 120 \
                --window-size 680 420 \
                --icon-size 112 \
                --text-size 13 \
                --icon "AlienShot.app" 190 222 \
                --hide-extension "AlienShot.app" \
                --app-drop-link 490 222 \
                AlienShot.dmg dmg-src/; then
              break
            fi
            echo "create-dmg failed (attempt $attempt)"
            sleep 5
          done
          if [ ! -f AlienShot.dmg ]; then
            echo "::warning::Styled DMG failed; building a plain one"
            ln -s /Applications dmg-src/Applications
            hdiutil create -volname AlienShot -srcfolder dmg-src -ov -format UDZO AlienShot.dmg
          fi
          hdiutil verify AlienShot.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: AlienShot-macos
          path: build/macos/Build/Products/Release/AlienShot-macos.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: AlienShot-dmg
          path: AlienShot.dmg
          if-no-files-found: error
