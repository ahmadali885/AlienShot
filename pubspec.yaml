name: snapgrab
description: "AlienShot by AlienWave — a lightweight cross-platform screenshot and annotation tool for Windows and macOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  hotkey_manager: ^0.2.3
  screen_capturer: ^0.2.3
  win32: ^5.15.0
  ffi: ^2.1.0
  url_launcher: ^6.3.0
  uni_platform: ^0.1.3
  super_clipboard: ^0.9.1
  file_selector: ^1.1.0
  http: ^1.6.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  shaders:
    - shaders/hero.frag

  # Same typefaces as alienwavegroup.com: Outfit for headings, Urbanist for UI
  # text. Bundled rather than fetched so a tray app works offline from the
  # first launch. Both are SIL OFL (licences alongside in assets/fonts/).
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Regular.ttf
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 700
